# Pick and Place Node Configuration

pick_place_node:
  ros__parameters:
    # Pick location (point A) - front-right of robot workspace
    # Coordinates relative to world frame (robot base on table)
    pick_position: [0.20, 0.15, 0.92]  # x, y, z in meters

    # Place location (point B) - front-left of robot workspace
    place_position: [0.20, -0.15, 0.92]  # x, y, z in meters

    # Approach height above pick/place positions
    approach_height: 0.15  # meters

    # Object height (for grasp point calculation)
    object_height: 0.04  # meters

    # Home joint configuration (radians)
    # Safe position with arm tucked back
    home_joints:
      - 0.0        # shoulder_pan
      - -1.5708    # shoulder_lift (-90 deg)
      - 1.5708     # elbow (90 deg)
      - -1.5708    # wrist_1 (-90 deg)
      - -1.5708    # wrist_2 (-90 deg)
      - 0.0        # wrist_3

    # Motion speed multiplier (lower = faster)
    motion_speed: 0.5

    # State publishing rate (Hz)
    publish_rate: 10.0

gripper_controller:
  ros__parameters:
    # Gripper finger positions (meters)
    open_position: 0.04
    closed_position: 0.002

    # Time for open/close transition (seconds)
    transition_time: 0.5

    # Joint state publishing rate (Hz)
    publish_rate: 50.0
