# =============================================================================
# Universal Robots + ROS2 Docker Compose Configuration
# =============================================================================
#
# Usage:
#   Simulation mode:  docker compose --profile sim up
#   Real robot mode:  docker compose --profile real up
#   Build for distro: ROS_DISTRO=jazzy docker compose build
#
# =============================================================================

x-common-env: &common-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}

services:
  # ===========================================================================
  # URSim - Universal Robots Simulator
  # ===========================================================================
  ursim:
    build:
      context: ./docker/ursim
      args:
        URSIM_VERSION: ${URSIM_VERSION:-latest}
        URCAP_VERSION: ${URCAP_VERSION:-1.0.5}
    image: ur-ursim:${URSIM_VERSION:-latest}
    container_name: ursim
    hostname: ursim
    profiles:
      - sim
      - full
    environment:
      ROBOT_MODEL: ${ROBOT_MODEL:-UR5}
    ports:
      - "5900:5900"           # VNC
      - "6080:6080"           # Web VNC
      - "29999:29999"         # Dashboard Server
      - "30001:30001"         # Primary Interface
      - "30002:30002"         # Secondary Interface
      - "30003:30003"         # Real-Time Interface
      - "30004:30004"         # RTDE Interface
    volumes:
      - ${PROGRAMS_DIR:-./programs}:/ursim/programs
      - ursim-urcaps:/urcaps
    networks:
      ur-network:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/29999"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # ROS2 UR Driver - Connects to robot (sim or real)
  # ===========================================================================
  ur-driver:
    build:
      context: ./docker/ros2-driver
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        BUILD_FROM_SOURCE: ${BUILD_FROM_SOURCE:-false}
    image: ur-ros2-driver:${ROS_DISTRO:-humble}
    container_name: ur-driver
    hostname: ur-driver
    profiles:
      - sim
      - real
      - full
    environment:
      <<: *common-env
      ROBOT_IP: ${ROBOT_IP:-172.20.0.2}
      UR_TYPE: ${UR_TYPE:-ur5e}
      LAUNCH_RVIZ: ${LAUNCH_RVIZ:-false}
      HEADLESS_MODE: ${HEADLESS_MODE:-true}
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${CALIBRATION_DIR:-./config/calibration}:/calibration:ro
      - ${CONFIG_DIR:-./config}:/config:ro
      - driver-workspace:/ros2_ws
    networks:
      ur-network:
        ipv4_address: 172.20.0.3
    depends_on:
      ursim:
        condition: service_healthy
        required: false
    command: bash -c "ros2 launch ur_robot_driver ur_control.launch.py ur_type:=$${UR_TYPE} robot_ip:=$${ROBOT_IP} headless_mode:=$${HEADLESS_MODE} launch_rviz:=$${LAUNCH_RVIZ} initial_joint_controller:=scaled_joint_trajectory_controller"

  # ===========================================================================
  # ROS2 RViz - Visualization (optional)
  # ===========================================================================
  rviz:
    build:
      context: ./docker/ros2-driver
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    image: ur-ros2-driver:${ROS_DISTRO:-humble}
    container_name: ur-rviz
    hostname: ur-rviz
    profiles:
      - viz
      - full
    environment:
      <<: *common-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${CONFIG_DIR:-./config}:/config:ro
    networks:
      - ur-network
    command: >
      bash -c "
        ros2 launch ur_robot_driver ur_control.launch.py
          ur_type:=$${UR_TYPE:-ur5e}
          robot_ip:=none
          use_fake_hardware:=true
          launch_rviz:=true
      "

  # ===========================================================================
  # ROS2 Development Container
  # ===========================================================================
  ros2-dev:
    build:
      context: ./docker/ros2-driver
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    image: ur-ros2-driver:${ROS_DISTRO:-humble}
    container_name: ros2-dev
    hostname: ros2-dev
    profiles:
      - dev
    environment:
      <<: *common-env
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${WORKSPACE_DIR:-./workspace}:/home/ros/workspace:rw
      - ${CONFIG_DIR:-./config}:/config:ro
    networks:
      - ur-network
    stdin_open: true
    tty: true
    command: bash

# =============================================================================
# Networks
# =============================================================================
networks:
  ur-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

# =============================================================================
# Volumes
# =============================================================================
volumes:
  ursim-urcaps:
    name: ursim-urcaps
  driver-workspace:
    name: ur-driver-workspace
